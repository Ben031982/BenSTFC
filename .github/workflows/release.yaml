name: Publish NGO Release from Tag

on:
  push:
    tags:
      - "v*" # v0.6.1 or v0.6.1.alpha.9
      - "!v*-ngo.private.*"

permissions:
  contents: write
  actions: read

jobs:
  create-release:
    name: Publish NGO Release from Tag
    runs-on: ubuntu-24.04

    steps:
      # Find a successful Build workflow for this exact commit.
      #
      # Release intentionally reuses the artifacts from CI rather than
      # rebuilding Windows/macOS from the tag.
      - name: Find successful Build
        id: check_build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "Checking for successful Build workflow for commit ${{ github.sha }}..."

          build_run_id="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&status=success&per_page=100" \
              --jq '.workflow_runs[] | select(.name == "Build") | .id' \
              | head -n 1
          )"

          if [[ -z "$build_run_id" ]]; then
            echo "::error::No successful Build workflow found for commit ${{ github.sha }}."
            exit 1
          fi

          echo "Found successful Build run ID: $build_run_id"
          echo "build_run_id=$build_run_id" >> "$GITHUB_OUTPUT"

      # Download only release-facing CI artifacts.
      - name: Download Windows build
        uses: actions/download-artifact@v8
        with:
          name: stfc-community-mod
          path: stfc-community-mod
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.check_build.outputs.build_run_id }}

      - name: Download macOS universal archive
        uses: actions/download-artifact@v8
        with:
          name: stfc-community-mod-macos-universal
          path: stfc-community-mod-macos-universal
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.check_build.outputs.build_run_id }}

      - name: Download macOS installer
        uses: actions/download-artifact@v8
        with:
          name: stfc-community-mod-installer
          path: stfc-community-mod-installer
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.check_build.outputs.build_run_id }}

      - name: Validate Build artifacts
        shell: bash
        run: |
          set -euo pipefail

          test -f stfc-community-mod/version.dll

          test -f \
            stfc-community-mod-macos-universal/stfc-community-mod-macos-universal.tar.zst

          test -f \
            stfc-community-mod-macos-universal/stfc-community-mod-macos-universal.tar.zst.sha256

          test -f \
            stfc-community-mod-installer/stfc-community-mod-installer.dmg

      # Legacy Windows ZIP.
      #
      # Keep both historical names as release assets.
      - name: Package legacy Windows ZIPs
        shell: bash
        run: |
          set -euo pipefail

          (
            cd stfc-community-mod
            zip -9 -q -r ../stfc-community-mod.zip .
          )

          cp \
            stfc-community-mod.zip \
            "stfc-community-mod-${{ github.ref_name }}.zip"

      # Native Windows archive used by newer installers/updaters.
      - name: Package Windows mod archive
        shell: bash
        run: |
          set -euo pipefail

          command -v zstd >/dev/null

          mkdir -p stfc-community-mod-windows-x64

          tar -cf - \
            -C stfc-community-mod \
            version.dll \
            | zstd -15 -T0 \
              -o stfc-community-mod-windows-x64/stfc-community-mod-windows-x64.tar.zst

          sha256sum \
            stfc-community-mod-windows-x64/stfc-community-mod-windows-x64.tar.zst \
            | awk '{print $1}' \
            > stfc-community-mod-windows-x64/stfc-community-mod-windows-x64.tar.zst.sha256

      - name: Check Prerelease
        id: check-prerelease
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.(alpha|beta)\.[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # For NGO patch releases (.2, .3, ...), inherit the manually enriched
      # release description from the matching .1 release.
      - name: Prepare Release Notes
        id: release-notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$RELEASE_TAG" =~ ^(.+-ngo\.)[0-9]+$ ]]; then
            ngo_revision="${RELEASE_TAG##*.}"

            if (( ngo_revision > 1 )); then
              base_tag="${BASH_REMATCH[1]}1"

              echo "NGO revision is $ngo_revision. Inheriting release notes from $base_tag..."

              if ! gh api \
                -H "Accept: application/vnd.github+json" \
                "/repos/${{ github.repository }}/releases/tags/$base_tag" \
                --jq '.body // ""' \
                > inherited-release-notes.md; then
                echo "::error::Could not read release notes from $base_tag."
                exit 1
              fi

              if [[ ! -s inherited-release-notes.md ]]; then
                echo "::error::Release $base_tag has no release description to inherit."
                exit 1
              fi

              echo "inherit=true" >> "$GITHUB_OUTPUT"
              echo "body_file=inherited-release-notes.md" >> "$GITHUB_OUTPUT"
              echo "Inherited release notes from $base_tag."
              exit 0
            fi
          fi

          echo "inherit=false" >> "$GITHUB_OUTPUT"
          echo "body_file=" >> "$GITHUB_OUTPUT"
          echo "Using automatically generated GitHub release notes."

      # Create or update the release and upload every release asset.
      - name: Publish NGO Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true

          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}

          generateReleaseNotes: ${{ steps.release-notes.outputs.inherit != 'true' }}
          bodyFile: ${{ steps.release-notes.outputs.body_file }}
          prerelease: ${{ steps.check-prerelease.outputs.prerelease }}

          artifactErrorsFailBuild: true

          artifacts: |
            stfc-community-mod.zip
            stfc-community-mod-${{ github.ref_name }}.zip
            stfc-community-mod-windows-x64/stfc-community-mod-windows-x64.tar.zst
            stfc-community-mod-windows-x64/stfc-community-mod-windows-x64.tar.zst.sha256
            stfc-community-mod-macos-universal/stfc-community-mod-macos-universal.tar.zst
            stfc-community-mod-macos-universal/stfc-community-mod-macos-universal.tar.zst.sha256
            stfc-community-mod-installer/stfc-community-mod-installer.dmg
