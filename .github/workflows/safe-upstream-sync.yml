name: Safe upstream sync

on:
  schedule:
    - cron: "0 6 * * *"
      timezone: "Europe/Berlin"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync upstream dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: dev
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        shell: bash
        run: |
          set -euo pipefail

          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/netniV/stfc-mod.git
          else
            git remote add upstream https://github.com/netniV/stfc-mod.git
          fi

          git fetch upstream dev

      - name: Check for upstream updates
        id: check
        shell: bash
        run: |
          set -euo pipefail

          if git merge-base --is-ancestor upstream/dev HEAD; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Fork already contains all commits from upstream/dev."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "New commits found on upstream/dev."
          fi

      - name: Merge upstream safely
        if: steps.check.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "Starting safe merge from upstream/dev..."

          if git merge upstream/dev --no-edit --no-commit; then
            echo "Upstream merged without conflicts."
          else
            echo "Merge conflicts detected."
            echo "Checking whether all conflicts are approved NGO branding conflicts..."

            conflicts="$(git diff --name-only --diff-filter=U)"

            echo "Conflicting files:"
            echo "$conflicts"

            # Files where the NGO version must always win.
            protected_files=(
              "assets/loadingscreen.png"
              "assets/stfc-mod-logo-fullsize.png"
              "assets/stfc-mod-logo.png"
              "mods/src/patches/parts/embedded_loading_image.h"
              "mods/src/patches/parts/embedded_logo_image.h"
              "mods/src/patches/parts/loading.png"
            )

            is_protected_file() {
              local file="$1"

              for protected in "${protected_files[@]}"; do
                if [[ "$file" == "$protected" ]]; then
                  return 0
                fi
              done

              return 1
            }

            # Abort if ANY conflict exists outside the approved NGO files.
            while IFS= read -r file; do
              [[ -z "$file" ]] && continue

              if ! is_protected_file "$file"; then
                echo "::error::Unexpected merge conflict in $file"
                echo "::error::Merge aborted. Nothing will be pushed."

                git merge --abort || true
                exit 1
              fi
            done <<< "$conflicts"

            # Keep our NGO version of every protected conflicting file.
            while IFS= read -r file; do
              [[ -z "$file" ]] && continue

              if is_protected_file "$file"; then
                echo "Keeping NGO version of $file"

                git checkout --ours -- "$file"
                git add "$file"
              fi
            done <<< "$conflicts"

            # Verify that every conflict has been resolved.
            remaining_conflicts="$(git diff --name-only --diff-filter=U)"

            if [[ -n "$remaining_conflicts" ]]; then
              echo "::error::Unresolved merge conflicts remain:"
              echo "$remaining_conflicts"

              git merge --abort || true
              exit 1
            fi

            echo "All approved NGO conflicts resolved successfully."

            git commit --no-edit
          fi

      - name: Verify merge
        if: steps.check.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "Git status:"
          git status --short

          if ! git merge-base --is-ancestor upstream/dev HEAD; then
            echo "::error::Upstream branch was not merged successfully."
            exit 1
          fi

          echo "Upstream/dev successfully merged into BenSTFC/dev."

      - name: Push updated dev branch
        if: steps.check.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "Pushing updated dev branch..."
          git push origin HEAD:dev

      - name: No update required
        if: steps.check.outputs.needed == 'false'
        run: |
          echo "BenSTFC/dev is already up to date with netniV/stfc-mod:dev."
