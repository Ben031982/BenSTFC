name: Private Test Release

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Optional netniV release tag (leave empty for latest official release)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: private-test-release
  cancel-in-progress: false

env:
  XMAKE_VERSION: "3.1.0"

jobs:
  private-test-release:
    name: Build private Windows draft release
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout NGO dev
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: dev

      - name: Resolve upstream release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        run: |
          if ($env:REQUESTED_TAG) {
            $upstreamTag = $env:REQUESTED_TAG.Trim()
          } else {
            $upstreamTag = gh api /repos/netniV/stfc-mod/releases/latest --jq '.tag_name'
            $upstreamTag = $upstreamTag.Trim()
          }

          if (-not $upstreamTag) { throw "Could not determine netniV release tag." }

          $draftTag = "private-$upstreamTag-ngo.1"
          "upstream_tag=$upstreamTag" >> $env:GITHUB_OUTPUT
          "draft_tag=$draftTag" >> $env:GITHUB_OUTPUT

          Write-Host "Upstream release: $upstreamTag"
          Write-Host "Private draft release tag: $draftTag"

      - name: Skip if private draft already exists
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_TAG: ${{ steps.release.outputs.draft_tag }}
        run: |
          $json = gh api "/repos/${{ github.repository }}/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to query existing releases."
          }

          $releases = $json | ConvertFrom-Json
          $existing = $releases | Where-Object { $_.tag_name -eq $env:DRAFT_TAG } | Select-Object -First 1

          if ($existing) {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "Private draft already exists: $($existing.id). Nothing to do."
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
            Write-Host "No existing private draft found for $env:DRAFT_TAG."
          }

      - name: Verify private source secret
        if: steps.existing.outputs.exists == 'false'
        shell: pwsh
        env:
          PRIVATE_TESTING_CC_B64: ${{ secrets.PRIVATE_TESTING_CC_B64 }}
        run: |
          if (-not $env:PRIVATE_TESTING_CC_B64) {
            throw "Missing repository secret PRIVATE_TESTING_CC_B64. Store the Base64 encoded private testing.cc there."
          }

      - name: Inject private testing.cc in runner only
        if: steps.existing.outputs.exists == 'false'
        shell: pwsh
        env:
          PRIVATE_TESTING_CC_B64: ${{ secrets.PRIVATE_TESTING_CC_B64 }}
        run: |
          $bytes = [Convert]::FromBase64String($env:PRIVATE_TESTING_CC_B64)
          [IO.File]::WriteAllBytes("mods/src/patches/parts/testing.cc", $bytes)
          Write-Host "Private testing.cc injected into runner workspace only."

      - name: Stamp commit hash
        if: steps.existing.outputs.exists == 'false'
        shell: pwsh
        run: python scripts/stamp-version-hash.py "${{ github.sha }}"

      - name: Setup XMake
        if: steps.existing.outputs.exists == 'false'
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}

      - name: Configure
        if: steps.existing.outputs.exists == 'false'
        shell: pwsh
        run: xmake f -m release -y -v

      - name: Build private Windows mod
        if: steps.existing.outputs.exists == 'false'
        shell: pwsh
        run: xmake build -y stfc-community-mod

      - name: Package private release
        if: steps.existing.outputs.exists == 'false'
        shell: pwsh
        env:
          DRAFT_TAG: ${{ steps.release.outputs.draft_tag }}
        run: |
          New-Item -ItemType Directory -Force private-release | Out-Null
          Copy-Item "build/windows/x64/release/stfc-community-mod.dll" "private-release/version.dll"
          Compress-Archive -Path "private-release/version.dll" -DestinationPath "private-release/stfc-community-mod-$env:DRAFT_TAG.zip" -Force

      - name: Create private draft release
        if: steps.existing.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_TAG: ${{ steps.release.outputs.draft_tag }}
          UPSTREAM_TAG: ${{ steps.release.outputs.upstream_tag }}
        run: |
          $body = @"
          Private NGO test build based on netniV release $env:UPSTREAM_TAG.

          This release is intentionally kept as a GitHub Draft Release and is not published publicly.
          The private testing.cc is injected only inside the GitHub Actions runner and is not committed to the repository.
          "@

          $zip = "private-release/stfc-community-mod-$env:DRAFT_TAG.zip"

          gh release create "$env:DRAFT_TAG" `
            "$zip" `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "Private NGO Test - $env:UPSTREAM_TAG" `
            --notes "$body" `
            --draft

          Write-Host "Private draft release created successfully."
