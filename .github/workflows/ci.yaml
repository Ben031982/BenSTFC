name: Build

on:
  push:
    branches: [main, dev, spielwiese]
  pull_request:
    branches: [main, dev]

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.16.0"

jobs:
  build-win:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Stamp commit hash
        run: python scripts/stamp-version-hash.py "${{ github.sha }}"
      # NGO fork: upstream fetches its pinned MSVC 14.50 sysroot from STFC_WINDOWS_TOOLCHAIN_URL, which this fork
      # does not have. The runner's default MSVC (14.52) needs Clang 22, newer than Zig 0.16's. So install the
      # MSVC 14.50 component and lay it out where zig/toolchains.zig looks for the pinned sysroot
      # (.cache/toolchain/windows-msvc/<version>, with msvc/ and winsdk/), using junctions to the installed files.
      - name: "NGO: provision MSVC 14.50 sysroot from the runner"
        if: ${{ vars.STFC_WINDOWS_TOOLCHAIN_URL == '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $pin = (Select-String -Path zig/toolchains.zon -Pattern '\.version = "(msvc-[^"]+)"').Matches[0].Groups[1].Value
          $sdkVersion = ($pin -split '_sdk-')[1]
          Write-Host "Pinned toolchain: $pin (Windows SDK $sdkVersion)"

          $installerDir = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $vs = & "$installerDir\vswhere.exe" -latest -products * -property installationPath
          $installArgs = @('/c', 'vs_installer.exe', 'modify', '--installPath', "`"$vs`"",
            '--add', 'Microsoft.VisualStudio.Component.VC.14.50.18.0.x86.x64',
            '--quiet', '--norestart', '--nocache')
          $process = Start-Process -FilePath cmd.exe -ArgumentList $installArgs -WorkingDirectory $installerDir `
            -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -notin 0, 3010) { throw "Visual Studio installer failed with exit code $($process.ExitCode)" }

          $msvc = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Where-Object Name -like '14.50.*' |
            Sort-Object Name | Select-Object -Last 1
          if (-not $msvc) { throw "MSVC 14.50 is not installed after the installer ran." }
          Write-Host "Using MSVC $($msvc.Name)"

          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $root = ".cache\toolchain\windows-msvc\$pin"
          foreach ($dir in 'msvc\lib', 'winsdk\include', 'winsdk\lib\ucrt', 'winsdk\lib\um') {
            New-Item -ItemType Directory -Force -Path "$root\$dir" | Out-Null
          }
          function Link($path, $target) {
            if (-not (Test-Path $target)) { throw "Missing $target" }
            New-Item -ItemType Junction -Path $path -Target $target | Out-Null
          }
          Link "$root\msvc\include" "$($msvc.FullName)\include"
          Link "$root\msvc\lib\x64" "$($msvc.FullName)\lib\x64"
          foreach ($dir in 'ucrt', 'um', 'shared', 'winrt', 'cppwinrt') {
            Link "$root\winsdk\include\$dir" "$kits\Include\$sdkVersion\$dir"
          }
          Link "$root\winsdk\lib\ucrt\x64" "$kits\Lib\$sdkVersion\ucrt\x64"
          Link "$root\winsdk\lib\um\x64" "$kits\Lib\$sdkVersion\um\x64"
      - name: Provision pinned sysroot when configured
        shell: pwsh
        env:
          STFC_WINDOWS_TOOLCHAIN_URL: ${{ vars.STFC_WINDOWS_TOOLCHAIN_URL }}
        run: |
          if ($env:STFC_WINDOWS_TOOLCHAIN_URL) { zig build fetch-toolchains }
      - name: Build and test
        shell: pwsh
        run: |
          zig build install test-toolchains test-codegen test-deps test-il2cpp test-mod test-sync test-spud `
            -Dtarget=x86_64-windows-msvc -Doptimize=ReleaseFast -Dstrip=true -Dtest-optimize=Debug `
            "-Dstfc_source_state_id=git:${{ github.sha }}" `
            "-Dstfc_base_commit=${{ github.sha }}" `
            "-Dstfc_build_invocation_id=github:${{ github.run_id }}:${{ github.run_attempt }}:windows" `
            -Dstfc_build_channel=ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify proxy binary contract
        run: >-
          python scripts/verify-windows-binary.py --identity
          "stfc-identity-v1;distribution=netniv.stfc-community-mod;source=git:${{ github.sha }};base=${{ github.sha }};build=github:${{ github.run_id }}:${{ github.run_attempt }}:windows;mode=release;channel=ci"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: stfc-community-mod
          path: zig-out/bin/version.dll
          if-no-files-found: error

  cross-win:
    # Enable this by configuring a hosted sysroot URL; no temporary URL is committed.
    if: ${{ vars.STFC_WINDOWS_TOOLCHAIN_URL != '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Fetch and cross-compile
        env:
          STFC_WINDOWS_TOOLCHAIN_URL: ${{ vars.STFC_WINDOWS_TOOLCHAIN_URL }}
        run: |
          zig build fetch-toolchains
          zig build install build-tests -Dtarget=x86_64-windows-msvc -Doptimize=ReleaseFast -Dstrip=true -Dtest-optimize=Debug
          python3 scripts/verify-windows-binary.py

  # The native fixtures need no SDK, so they run on Linux too, where they are cheapest.
  test-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Test
        run: zig build test-toolchains test-codegen test-il2cpp test-mod test-sync test-launcher test-spud

  build-mac:
    name: build-mac (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The relocation test only has work on x86_64.
          - arch: arm64
            target: aarch64-macos.14.6
            runner: macos-26
            artifact: macos-arm64-build
            tests: test-sync test-launcher
          - arch: x86_64
            target: x86_64-macos.14.6
            runner: macos-26-intel
            artifact: macos-x86_64-build
            tests: test-sync test-launcher test-spud
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Stamp commit hash
        run: python3 scripts/stamp-version-hash.py "${{ github.sha }}"
      - name: Build and test
        run: |
          zig build install launcher test-toolchains test-codegen test-deps test-il2cpp test-mod ${{ matrix.tests }} \
            -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast -Dstrip=true -Dtest-optimize=Debug --summary all
      - name: Verify portable linkage
        run: |
          scripts/check-mac-linkage.sh zig-out/macOSLauncher.app/Contents/MacOS/macOSLauncher \
            zig-out/bin/stfc-community-mod-loader zig-out/lib/libstfc-community-mod.dylib
      # The install prefix as scripts/assemble-mac-app.sh expects it.
      - name: Package intermediate build
        run: |
          tar -cf macos-${{ matrix.arch }}-build.tar -C zig-out \
            macOSLauncher.app bin/stfc-community-mod-loader lib/libstfc-community-mod.dylib
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: macos-${{ matrix.arch }}-build.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  attest-win:
    name: attest-win
    needs: build-win
    if: >-
      github.event_name == 'push' &&
      github.repository == 'STFC-Mod/mod' &&
      github.ref_protected &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: windows-2025-vs2026
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download Windows DLL
        uses: actions/download-artifact@v8.0.1
        with:
          name: stfc-community-mod
          path: .artifacts/windows

      - name: Attest Windows DLL
        uses: actions/attest@v4.2.1
        with:
          subject-path: .artifacts/windows/version.dll


  package-mac:
    name: package-mac
    needs: build-mac
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false
          show-progress: false

      - name: Download ARM64 build
        uses: actions/download-artifact@v8.0.1
        with:
          name: macos-arm64-build
          path: .artifacts/arm64

      - name: Download x86_64 build
        uses: actions/download-artifact@v8.0.1
        with:
          name: macos-x86_64-build
          path: .artifacts/x86_64

      - name: Restore architecture builds
        run: |
          for arch in arm64 x86_64; do
            mkdir -p "zig-out/staging/$arch"
            tar -xf ".artifacts/$arch/macos-$arch-build.tar" -C "zig-out/staging/$arch"
          done

      - name: Assemble universal app bundle
        run: |
          scripts/assemble-mac-app.sh "zig-out/staging/STFC Community Mod.app" \
            zig-out/staging/arm64 zig-out/staging/x86_64

      - name: Verify universal binaries
        run: |
          set -euo pipefail
          APP="zig-out/staging/STFC Community Mod.app"
          for binary in MacOS/macOSLauncher stfc-community-mod-loader libstfc-community-mod.dylib; do
            archs="$(lipo -archs "$APP/Contents/$binary")"
            echo "$binary: $archs"
            [[ " $archs " == *" arm64 "* && " $archs " == *" x86_64 "* ]]
          done

      - name: Install packaging tools
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail

          # zstd is currently preinstalled on the macOS 26 image.
          # Keep the fallback so the workflow remains robust if the
          # runner image changes later.
          command -v zstd >/dev/null 2>&1 || brew install zstd
          command -v create-dmg >/dev/null 2>&1 || brew install create-dmg

      - name: Package macOS mod archive
        run: |
          set -euo pipefail
          mkdir -p stfc-community-mod-macos-universal
          tar -cf - -C "zig-out/staging/STFC Community Mod.app/Contents" libstfc-community-mod.dylib \
            | zstd -15 -T0 -o stfc-community-mod-macos-universal/stfc-community-mod-macos-universal.tar.zst
          shasum -a 256 stfc-community-mod-macos-universal/stfc-community-mod-macos-universal.tar.zst \
            | awk '{print $1}' \
            > stfc-community-mod-macos-universal/stfc-community-mod-macos-universal.tar.zst.sha256

      - name: Create installer
        run: scripts/create-mac-dmg.sh "zig-out/staging/STFC Community Mod.app" stfc-community-mod-installer.dmg

      - name: Upload installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: stfc-community-mod-installer
          path: stfc-community-mod-installer.dmg
          compression-level: 0
          if-no-files-found: error

      - name: Upload macOS mod archive
        uses: actions/upload-artifact@v7.0.1
        with:
          name: stfc-community-mod-macos-universal
          path: stfc-community-mod-macos-universal
          compression-level: 0
          if-no-files-found: error
